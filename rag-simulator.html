<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG, made visible</title>
  <style>
    :root { --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --blue:#0071e3; --blue-soft:#e8f3ff; --surface:#fff; --bg:#f5f5f7; --green:#16803c; --orange:#b05a00; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; color:var(--ink); background:var(--bg); letter-spacing:-.015em; }
    button, input { font:inherit; }
    .nav { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 max(22px,calc((100vw - 1120px)/2)); background:rgba(255,255,255,.78); backdrop-filter:blur(18px); border-bottom:1px solid rgba(0,0,0,.08); position:sticky; top:0; z-index:5; }
    .brand { font-size:18px; font-weight:650; letter-spacing:-.04em; }.brand span{color:var(--blue)}
    .status { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px; }.dot{width:7px;height:7px;background:#34c759;border-radius:50%;}
    main { max-width:1120px; margin:auto; padding:68px 22px 44px; }
    .hero { text-align:center; max-width:740px; margin:0 auto 44px; }.eyebrow{color:var(--blue);text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.08em}.hero h1{font-size:clamp(40px,7vw,72px);line-height:.98;letter-spacing:-.065em;margin:13px 0 18px}.hero p{font-size:20px;line-height:1.45;color:var(--muted);margin:0}
    .sim { background:var(--surface); border:1px solid rgba(0,0,0,.08); border-radius:24px; box-shadow:0 12px 36px rgba(0,0,0,.06); overflow:hidden; }
    .steps { display:grid; grid-template-columns:repeat(6,1fr); border-bottom:1px solid var(--line); }.step { min-height:88px; background:white; color:var(--muted); border:0; border-right:1px solid #ececef; padding:14px 9px; cursor:pointer; text-align:center; transition:.2s; }.step:last-child{border-right:0}.step:hover{background:#fafafa}.step.active{color:var(--blue); background:linear-gradient(#fff,var(--blue-soft));}.step .num{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.step .name{font-size:13px;font-weight:600;display:block}
    .stage { min-height:455px; padding:34px; position:relative; overflow:hidden; }.stage-top{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;margin-bottom:25px}.stage h2{font-size:30px;letter-spacing:-.04em;margin:0 0 8px}.stage .explain{color:var(--muted);font-size:16px;line-height:1.45;max-width:630px;margin:0}.tag{font-size:12px;font-weight:650;border-radius:100px;padding:7px 10px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
    .visual { background:#fafafa; border:1px solid #e8e8ed; border-radius:18px; padding:18px; min-height:245px; }
    .doc{background:#fff;border:1px solid #dcdce1;border-radius:12px;padding:13px 15px;max-width:640px;font-size:14px;line-height:1.48;box-shadow:0 3px 10px #00000008}.doc strong{color:var(--blue)}.chunks{display:flex;gap:10px;flex-wrap:wrap;align-content:start}.chunk{background:white;border:1px solid #d6d6dc;border-radius:12px;padding:12px;width:calc(33.333% - 7px);font-size:13px;line-height:1.35;box-shadow:0 2px 6px #00000007}.chunk b{display:block;font-size:11px;color:var(--blue);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}.vectors{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.vector{background:#fff;border:1px solid #d6d6dc;border-radius:12px;padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#51515a;overflow:hidden}.vector .vname{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);font-weight:650;font-size:13px;margin-bottom:9px}.bars{display:flex;gap:3px;height:20px;align-items:end}.bar{width:10px;background:var(--blue);border-radius:3px 3px 1px 1px;opacity:.75}.querybox{background:#fff;border:1px solid #c9c9d1;border-radius:12px;padding:13px 15px;font-size:15px;display:flex;align-items:center;gap:9px;margin-bottom:16px}.querybox::before{content:'⌕';font-size:21px;color:var(--muted)}.filterrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filter{border:1px solid #b9d8f8;background:var(--blue-soft);color:#075ca9;border-radius:100px;padding:7px 10px;font-size:12px;font-weight:600}.filter.off{background:#fff;color:var(--muted);border-color:#ddd}
    .result-list{display:grid;gap:9px}.result{background:#fff;border:1px solid #dedee3;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;font-size:13px}.score{font-variant-numeric:tabular-nums;color:var(--blue);font-weight:700}.result.dim{opacity:.42}.result.best{border-color:#81baff;background:#f5faff}.rank{display:inline-block;width:20px;color:var(--muted);font-weight:650}.answer{background:linear-gradient(140deg,#f5faff,#fff);border:1px solid #b8d9fc;border-radius:15px;padding:20px;max-width:760px}.answer .label{font-size:12px;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.05em}.answer p{font-size:18px;line-height:1.5;margin:9px 0 0}.cite{display:inline-block;background:#dcedff;color:#075ca9;border-radius:5px;font-size:12px;font-weight:650;padding:2px 5px;white-space:nowrap}
    .foot { display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:16px}.progress{font-size:13px;color:var(--muted)}.controls{display:flex;gap:9px}.btn{border:0;border-radius:100px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}.secondary{background:#eeeef0;color:var(--ink)}.secondary:hover{background:#e2e2e5}.primary{background:var(--blue);color:white}.primary:hover{background:#0077ed}.primary:disabled{opacity:.35;cursor:default}
    .note{margin:22px auto 0;max-width:820px;color:var(--muted);font-size:14px;text-align:center;line-height:1.45}.note b{color:var(--ink)}
    @media(max-width:650px){main{padding:40px 14px 30px}.hero p{font-size:17px}.steps{grid-template-columns:repeat(3,1fr)}.step{min-height:68px;border-bottom:1px solid #ececef}.stage{padding:22px 16px;min-height:500px}.stage-top{display:block}.tag{display:inline-block;margin-top:10px}.chunk,.vectors{width:100%}.chunk{width:100%}.vectors{grid-template-columns:1fr}.foot{align-items:flex-end}.answer p{font-size:16px}}
  </style>
</head>
<body>
  <nav class="nav"><div class="brand">RAG <span>explorer</span></div><div class="status"><i class="dot"></i> Interactive demo</div></nav>
  <main>
    <section class="hero"><div class="eyebrow">Retrieval-augmented generation</div><h1>See how RAG thinks.</h1><p>Walk a single question through the system—from raw knowledge to a grounded answer.</p></section>
    <section class="sim" aria-label="RAG process simulator">
      <div class="steps" id="steps"></div>
      <div class="stage"><div class="stage-top"><div><h2 id="title"></h2><p class="explain" id="explain"></p></div><span class="tag" id="tag"></span></div><div class="visual" id="visual"></div><div class="foot"><span class="progress" id="progress"></span><div class="controls"><button class="btn secondary" id="back">Back</button><button class="btn primary" id="next">Next step</button></div></div></div>
    </section>
    <p class="note"><b>Key idea:</b> RAG does not teach the model new facts permanently. It gives the model the most useful source material <em>at answer time</em>.</p>
  </main>
  <script>
    const steps = [
      {name:'Source', tag:'Raw knowledge', title:'Start with a document', explain:'This is the information you want the assistant to use. Large documents are hard to retrieve precisely, so RAG prepares them first.', visual:`<div class="doc"><strong>Remote work handbook</strong><br><br>Employees may work remotely up to <strong>three days each week</strong>, with their manager’s approval. Team members must be available during core collaboration hours. For international remote work, submit a request at least two weeks in advance.</div>`},
      {name:'Chunk', tag:'Preparation', title:'Split it into focused chunks', explain:'The document is divided into small, overlapping passages. Each chunk keeps enough context to make sense on its own.', visual:`<div class="chunks"><div class="chunk"><b>Chunk 01</b>Employees may work remotely up to three days each week.</div><div class="chunk"><b>Chunk 02</b>Remote work requires manager approval and availability during core hours.</div><div class="chunk"><b>Chunk 03</b>International remote-work requests must be submitted two weeks ahead.</div></div>`},
      {name:'Embed', tag:'Meaning as numbers', title:'Turn chunks into embeddings', explain:'An embedding model converts each chunk into a vector: a list of numbers representing its meaning. Similar meanings produce nearby vectors.', visual:`<div class="vectors">${['Chunk 01 · weekly policy','Chunk 02 · approval & hours','Chunk 03 · international work'].map((n,i)=>`<div class="vector"><div class="vname">${n}</div><div>[0.${82-i*7}, −0.${14+i*9}, 0.${51-i*4}, …]</div><div class="bars">${[40,70,25,90,50,75,35,60].map((h,j)=>`<i class="bar" style="height:${(h+i*11+j*3)%85+14}%"></i>`).join('')}</div></div>`).join('')}</div>`},
      {name:'Filter', tag:'Limit the search', title:'Apply metadata filters', explain:'Optional labels can rule out chunks before searching. For example, retrieve only information the user is permitted to see—or only a specific department or date.', visual:`<div class="querybox">How many days can I work remotely?</div><div class="filterrow"><span style="font-size:13px;color:var(--muted)">Filters:</span><span class="filter">Access: Employee</span><span class="filter">Document: Handbook</span><span class="filter off">Region: International</span></div><div style="margin-top:22px;font-size:13px;color:var(--muted)">Only eligible chunks continue to retrieval.</div>`},
      {name:'Retrieve', tag:'Semantic search', title:'Find the nearest chunks', explain:'The question is embedded too. The vector database quickly finds chunks whose meaning is closest to the question—not just those sharing exact words.', visual:`<div class="querybox">How many days can I work remotely?</div><div class="result-list"><div class="result best"><span><b class="rank">1</b>Chunk 01 — “...up to three days each week.”</span><span class="score">94% match</span></div><div class="result"><span><b class="rank">2</b>Chunk 02 — “...requires manager approval...”</span><span class="score">72% match</span></div><div class="result dim"><span><b class="rank">3</b>Chunk 03 — “International remote-work requests...”</span><span class="score">31% match</span></div></div>`},
      {name:'Generate', tag:'Grounded response', title:'Rerank, then answer', explain:'A reranker can make a final, more careful choice among retrieved results. The best chunks are placed beside the question for the LLM to use as temporary context.', visual:`<div class="querybox">How many days can I work remotely?</div><div class="answer"><div class="label">Assistant answer</div><p>You may work remotely for up to <strong>three days per week</strong>, provided you have your manager’s approval. <span class="cite">Source: Chunk 01</span></p></div><div style="font-size:13px;color:var(--muted);margin-top:14px">The model generates from its general ability <em>plus</em> the retrieved source context.</div>`}
    ];
    let current=0;
    const stepsEl=document.getElementById('steps'), title=document.getElementById('title'), explain=document.getElementById('explain'), tag=document.getElementById('tag'), visual=document.getElementById('visual'), progress=document.getElementById('progress'), back=document.getElementById('back'), next=document.getElementById('next');
    function render(){const s=steps[current]; stepsEl.innerHTML=steps.map((x,i)=>`<button class="step ${i===current?'active':''}" data-step="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="name">${x.name}</span></button>`).join('');title.textContent=s.title;explain.textContent=s.explain;tag.textContent=s.tag;visual.innerHTML=s.visual;progress.textContent=`Step ${current+1} of ${steps.length}`;back.disabled=current===0;next.disabled=current===steps.length-1;next.textContent=current===steps.length-1?'Complete':'Next step';document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{current=+b.dataset.step;render()})}
    back.onclick=()=>{if(current){current--;render()}};next.onclick=()=>{if(current<steps.length-1){current++;render()}};render();
  </script>
</body>
</html>
